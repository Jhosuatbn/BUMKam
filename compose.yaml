services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bumkam_app
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bumkam_db
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: bumkam_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bumkam_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: